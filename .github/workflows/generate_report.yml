name: Generate Starred Repos Report

on:
  schedule:
    - cron: '30 22 * * *'  # Daily at 6:30 Asia/Shanghai
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install dependencies
      run: uv sync --frozen --no-dev

    - name: Restore commit watermarks
      uses: actions/cache/restore@v6
      with:
        path: watermarks.json
        key: commit-watermarks-v2-${{ github.run_id }}
        restore-keys: |
          commit-watermarks-v2-

    - name: Restore report cache
      uses: actions/cache/restore@v6
      with:
        path: reports/
        key: report-cache-${{ github.run_id }}
        restore-keys: |
          report-cache-

    - name: Generate report
      id: generate_report
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # Summaries are disabled when no summarizer model is configured.
        SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL }}
        # only supports deepseek right now, could add more keys below
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        REPO_LIMIT: ${{ vars.REPO_LIMIT }}
        EMPTY_REPO_CONSECUTIVE_LIMIT: ${{ vars.EMPTY_REPO_CONSECUTIVE_LIMIT }}
      run: uv run --no-sync src/main.py

    # The release carries only current renderings (ADR-0002); dated assets
    # once accumulated to GitHub's 1000-assets-per-release cap and broke runs.
    - name: Update release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      with:
        name: "Activity Report ${{ steps.generate_report.outputs.report_date }}"
        tag_name: latest
        body_path: reports/recent_commits_latest.md
        files: |
          reports/recent_commits_latest.md
          reports/recent_commits_latest.json
          reports/feed.json
        overwrite_files: true

    # Caches are saved only after a successful publish (ADR-0003): if the
    # release step fails, watermarks roll back and the commits are refetched
    # and published on the next run instead of being silently dropped.
    - name: Save commit watermarks
      uses: actions/cache/save@v6
      with:
        path: watermarks.json
        key: commit-watermarks-v2-${{ github.run_id }}

    - name: Save report cache
      uses: actions/cache/save@v6
      with:
        path: reports/
        key: report-cache-${{ github.run_id }}

    - name: Publish latest report to pages branch
      run: |
        cp reports/recent_commits_latest.json reports/recent_commits_latest.md docs/
        git branch -D pages || true
        git checkout -b pages
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/recent_commits_latest.json docs/recent_commits_latest.md
        git commit -m "Update reports for ${{ steps.generate_report.outputs.report_date }}" || exit 0
        git push origin pages --force
